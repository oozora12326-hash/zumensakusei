<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A4図面ホワイトボード（図形認識・寸法線・複数ページ対応）</title>
  <style>
    :root {
      --bg-app: #1e232a;
      --bg-bar: #282f38;
      --bg-sub: #323b46;
      --border: #3f4a58;
      --text-main: #f3f6fa;
      --text-muted: #9aa7b8;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    .toolbar {
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      z-index: 10;
    }

    .subbar {
      background: var(--bg-sub);
      border-bottom: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      z-index: 9;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.22);
      padding: 3px;
      border-radius: 8px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 10px;
      min-height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      touch-action: manipulation;
    }

    button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button.toggle-on {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--success);
      color: #a7f3d0;
    }

    button.btn-export {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }

    button.btn-pdf {
      background: #059669;
      color: #fff;
      font-weight: 600;
    }

    button.btn-danger {
      color: #fca5a5;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      min-height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 0;
    }

    .color-dot.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--accent);
    }

    .page-indicator {
      font-size: 13px;
      font-weight: 600;
      padding: 0 8px;
      color: #e2e8f0;
    }

    .workspace {
      flex: 1;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: auto;
      position: relative;
      touch-action: none;
    }

    .paper-wrapper {
      position: relative;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      border-radius: 2px;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .dim-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .dim-modal-backdrop.open {
      display: flex;
    }

    .dim-modal {
      background: #282f38;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
    }

    .dim-modal h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
    }

    .dim-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #fff;
      margin-bottom: 10px;
    }

    .unit-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .unit-chip {
      background: #374151;
      font-size: 12px;
      padding: 5px 10px;
      min-height: 30px;
    }

    .dim-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .statusbar {
      background: var(--bg-bar);
      border-top: 1px solid var(--border);
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    #print-container {
      display: none;
    }

    @media print {
      body {
        background: #fff !important;
        height: auto !important;
        overflow: visible !important;
      }
      .toolbar, .subbar, .workspace, .statusbar, .dim-modal-backdrop {
        display: none !important;
      }
      #print-container {
        display: block !important;
      }
      .print-page {
        page-break-after: always;
        break-after: page;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .print-page img {
        max-width: 100%;
        max-height: 100vh;
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="group">
      <button type="button" id="tool-pen" class="active">✏️ ペン</button>
      <button type="button" id="tool-dim">↔️ 寸法線</button>
      <button type="button" id="tool-eraser">🧹 消しゴム</button>
    </div>

    <div class="group">
      <button type="button" id="toggle-shape" class="toggle-on">✨ 図形認識: ON</button>
    </div>

    <div class="group">
      <button type="button" class="color-dot active" data-color="#111827" style="background:#111827;" aria-label="黒"></button>
      <button type="button" class="color-dot" data-color="#dc2626" style="background:#dc2626;" aria-label="赤"></button>
      <button type="button" class="color-dot" data-color="#2563eb" style="background:#2563eb;" aria-label="青"></button>
      <button type="button" class="color-dot" data-color="#059669" style="background:#059669;" aria-label="緑"></button>
    </div>

    <div class="group">
      <button type="button" class="width-btn" data-width="1.2">極細</button>
      <button type="button" class="width-btn active" data-width="2.4">細</button>
      <button type="button" class="width-btn" data-width="4.5">中</button>
      <button type="button" class="width-btn" data-width="7.5">太</button>
    </div>

    <div class="group">
      <button type="button" id="btn-undo" disabled>↩️ 戻す</button>
      <button type="button" id="btn-redo" disabled>↪️ やり直し</button>
      <button type="button" id="btn-clear" class="btn-danger">🗑️ 全消去</button>
    </div>
  </div>

  <div class="subbar">
    <div class="group">
      <button type="button" id="page-prev">◀</button>
      <span id="page-label" class="page-indicator">1 / 1 ページ</span>
      <button type="button" id="page-next">▶</button>
      <button type="button" id="page-add">＋ 新規</button>
      <button type="button" id="page-dup">📋 複製</button>
      <button type="button" id="page-del" class="btn-danger">削除</button>
    </div>

    <div class="group">
      <button type="button" id="toggle-orient">📄 A4縦</button>
      <button type="button" id="toggle-grid" class="toggle-on">＃ 方眼: ON</button>
      <button type="button" id="toggle-grid-export" class="toggle-on">出力方眼: ON</button>
    </div>

    <div class="group">
      <button type="button" id="export-png" class="btn-export">🖼️ PNG保存</button>
      <button type="button" id="export-pdf" class="btn-pdf">📑 PDF出力</button>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <div class="paper-wrapper" id="paper-wrapper">
      <canvas id="board"></canvas>
    </div>
  </div>

  <div class="statusbar">
    <span id="status-msg">ペンモード：丸・四角・直線を描くと自動で図面化します</span>
    <span id="debug-info">待機中</span>
  </div>

  <div class="dim-modal-backdrop" id="dim-modal">
    <div class="dim-modal">
      <h3>寸法テキストを入力</h3>
      <input type="text" id="dim-input" class="dim-input" placeholder="例: 1200mm / 3.5m" />
      <div class="unit-chips">
        <button type="button" class="unit-chip" data-unit="mm">+ mm</button>
        <button type="button" class="unit-chip" data-unit="cm">+ cm</button>
        <button type="button" class="unit-chip" data-unit="m">+ m</button>
        <button type="button" class="unit-chip" data-unit="φ">φ</button>
      </div>
      <div class="dim-actions">
        <button type="button" id="dim-cancel">キャンセル</button>
        <button type="button" id="dim-ok" class="active">確定</button>
      </div>
    </div>
  </div>

  <div id="print-container"></div>

  <script>
    (function () {
      const statusMsg = document.getElementById("status-msg");
      const debugInfo = document.getElementById("debug-info");

      function logStatus(msg) {
        if (debugInfo) debugInfo.textContent = msg;
      }

      window.addEventListener("error", function (ev) {
        logStatus("エラー: " + (ev.message || "実行エラー"));
      });

      const A4_SHORT = 1240;
      const A4_LONG = 1754;

      const canvas = document.getElementById("board");
      const ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;
      const workspace = document.getElementById("workspace");
      const paperWrapper = document.getElementById("paper-wrapper");

      if (!canvas || !ctx || !workspace || !paperWrapper) {
        logStatus("キャンバス初期化失敗");
        return;
      }

      let tool = "pen";
      let autoShape = true;
      let penColor = "#111827";
      let penWidth = 2.4;
      let showGrid = true;
      let includeGridOnExport = true;

      function cloneElements(els) {
        return JSON.parse(JSON.stringify(els || []));
      }

      function createPage(orientation, elements) {
        return {
          orientation: orientation || "portrait",
          elements: cloneElements(elements),
          undoStack: [],
          redoStack: []
        };
      }

      let pages = [createPage("portrait", [])];
      let currentPageIndex = 0;

      let isDrawing = false;
      let inputMode = null; // 'touch' | 'pointer'
      let currentPoints = [];
      let dimStart = null;
      let dimCurrent = null;
      let eraserPos = null;
      let eraserErasedInDrag = false;
      let pendingDimTarget = null;
      let isNewDim = false;

      function currentPage() {
        return pages[currentPageIndex];
      }

      function getLogicalSize(page) {
        const p = page || currentPage();
        return p.orientation === "portrait"
          ? { width: A4_SHORT, height: A4_LONG }
          : { width: A4_LONG, height: A4_SHORT };
      }

      function pushHistory(page) {
        const p = page || currentPage();
        p.undoStack.push(JSON.stringify(p.elements));
        if (p.undoStack.length > 50) p.undoStack.shift();
        p.redoStack = [];
        updateUIState();
      }

      function undo() {
        const p = currentPage();
        if (!p.undoStack.length) return;
        p.redoStack.push(JSON.stringify(p.elements));
        p.elements = JSON.parse(p.undoStack.pop());
        render();
        updateUIState();
      }

      function redo() {
        const p = currentPage();
        if (!p.redoStack.length) return;
        p.undoStack.push(JSON.stringify(p.elements));
        p.elements = JSON.parse(p.redoStack.pop());
        render();
        updateUIState();
      }

      function resizeCanvasDisplay() {
        const p = currentPage();
        const size = getLogicalSize(p);
        canvas.width = size.width;
        canvas.height = size.height;

        const wsRect = workspace.getBoundingClientRect();
        const availW = Math.max(180, (wsRect.width || window.innerWidth) - 24);
        const availH = Math.max(220, (wsRect.height || window.innerHeight * 0.55) - 24);
        const scale = Math.min(availW / size.width, availH / size.height);

        const dispW = Math.max(120, Math.floor(size.width * scale));
        const dispH = Math.max(150, Math.floor(size.height * scale));

        paperWrapper.style.width = dispW + "px";
        paperWrapper.style.height = dispH + "px";

        render();
      }

      function clientToCanvas(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width || 1;
        const h = rect.height || 1;
        return {
          x: ((clientX - rect.left) / w) * canvas.width,
          y: ((clientY - rect.top) / h) * canvas.height
        };
      }

      function pointToSegmentDist(p, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
      }

      function recognizeShape(points, color, width) {
        if (!autoShape || !points || points.length < 5) {
          return { type: "stroke", points: points || [], color: color, width: width };
        }

        let pathLen = 0;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (let i = 0; i < points.length; i++) {
          const pt = points[i];
          if (pt.x < minX) minX = pt.x;
          if (pt.y < minY) minY = pt.y;
          if (pt.x > maxX) maxX = pt.x;
          if (pt.y > maxY) maxY = pt.y;
          if (i > 0) {
            pathLen += Math.hypot(pt.x - points[i - 1].x, pt.y - points[i - 1].y);
          }
        }

        if (pathLen < 35) {
          return { type: "stroke", points: points, color: color, width: width };
        }

        const first = points[0];
        const last = points[points.length - 1];
        const endDist = Math.hypot(last.x - first.x, last.y - first.y);
        const boxW = maxX - minX;
        const boxH = maxY - minY;
        const boxDiag = Math.hypot(boxW, boxH);

        // 1. 直線
        if (endDist > 40 && endDist / pathLen > 0.92) {
          let maxPerp = 0;
          for (let i = 0; i < points.length; i++) {
            const d = pointToSegmentDist(points[i], first, last);
            if (d > maxPerp) maxPerp = d;
          }
          if (maxPerp / endDist < 0.07) {
            let x2 = last.x;
            let y2 = last.y;
            const deg = Math.abs(Math.atan2(y2 - first.y, x2 - first.x) * 180 / Math.PI);
            if (deg < 4 || deg > 176) y2 = first.y;
            if (Math.abs(deg - 90) < 4) x2 = first.x;
            return { type: "line", x1: first.x, y1: first.y, x2: x2, y2: y2, color: color, width: width };
          }
        }

        // 閉路判定
        const isClosed = endDist < Math.max(45, boxDiag * 0.24) && boxW > 30 && boxH > 30;
        if (!isClosed) {
          return { type: "stroke", points: points, color: color, width: width };
        }

        let area = 0;
        for (let i = 0; i < points.length; i++) {
          const j = (i + 1) % points.length;
          area += points[i].x * points[j].y - points[j].x * points[i].y;
        }
        area = Math.abs(area) / 2;
        const areaRatio = area / Math.max(1, boxW * boxH);

        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const rx = Math.max(1, boxW / 2);
        const ry = Math.max(1, boxH / 2);

        let sumR = 0;
        const radii = [];
        for (let i = 0; i < points.length; i++) {
          const r = Math.hypot((points[i].x - cx) / rx, (points[i].y - cy) / ry);
          radii.push(r);
          sumR += r;
        }
        const meanR = sumR / radii.length;
        let sqSum = 0;
        for (let i = 0; i < radii.length; i++) {
          sqSum += Math.pow(radii[i] - meanR, 2);
        }
        const cvR = Math.sqrt(sqSum / radii.length) / Math.max(0.0001, meanR);

        // 2. 丸・楕円
        if (cvR < 0.14 && areaRatio > 0.64 && areaRatio < 0.89) {
          const ratio = boxW / Math.max(1, boxH);
          if (ratio > 0.88 && ratio < 1.12) {
            const r = (rx + ry) / 2;
            return { type: "ellipse", cx: cx, cy: cy, rx: r, ry: r, color: color, width: width };
          }
          return { type: "ellipse", cx: cx, cy: cy, rx: rx, ry: ry, color: color, width: width };
        }

        // 3. 四角形
        if (areaRatio >= 0.78 && areaRatio <= 1.08) {
          return { type: "rect", x: minX, y: minY, w: boxW, h: boxH, color: color, width: width };
        }

        return { type: "stroke", points: points, color: color, width: width };
      }

      function hitTestElement(el, pos, radius) {
        const r = radius || 24;
        if (el.type === "stroke") {
          for (let i = 0; i < el.points.length; i++) {
            const p = el.points[i];
            if (Math.hypot(p.x - pos.x, p.y - pos.y) <= r + el.width) return true;
            if (i > 0 && pointToSegmentDist(pos, el.points[i - 1], p) <= r + el.width) return true;
          }
          return false;
        }
        if (el.type === "line") {
          return pointToSegmentDist(pos, { x: el.x1, y: el.y1 }, { x: el.x2, y: el.y2 }) <= r + el.width;
        }
        if (el.type === "rect") {
          const tol = r + el.width;
          const p1 = { x: el.x, y: el.y };
          const p2 = { x: el.x + el.w, y: el.y };
          const p3 = { x: el.x + el.w, y: el.y + el.h };
          const p4 = { x: el.x, y: el.y + el.h };
          return (
            pointToSegmentDist(pos, p1, p2) <= tol ||
            pointToSegmentDist(pos, p2, p3) <= tol ||
            pointToSegmentDist(pos, p3, p4) <= tol ||
            pointToSegmentDist(pos, p4, p1) <= tol
          );
        }
        if (el.type === "ellipse") {
          const norm = Math.hypot((pos.x - el.cx) / Math.max(1, el.rx), (pos.y - el.cy) / Math.max(1, el.ry));
          const avgR = (el.rx + el.ry) / 2;
          return Math.abs(norm - 1) * avgR <= r + el.width;
        }
        if (el.type === "dimension") {
          if (pointToSegmentDist(pos, { x: el.x1, y: el.y1 }, { x: el.x2, y: el.y2 }) <= r + 6) return true;
          const mx = (el.x1 + el.x2) / 2;
          const my = (el.y1 + el.y2) / 2;
          return Math.hypot(pos.x - mx, pos.y - my) <= r + 36;
        }
        return false;
      }

      function findDimensionAt(pos) {
        const els = currentPage().elements;
        for (let i = els.length - 1; i >= 0; i--) {
          const el = els[i];
          if (el.type === "dimension") {
            const mx = (el.x1 + el.x2) / 2;
            const my = (el.y1 + el.y2) / 2;
            if (Math.hypot(pos.x - mx, pos.y - my) <= 55) return el;
          }
        }
        return null;
      }

      function eraseAt(pos) {
        const p = currentPage();
        const before = p.elements.length;
        const nextEls = p.elements.filter(function (el) {
          return !hitTestElement(el, pos, 24);
        });
        if (nextEls.length !== before) {
          if (!eraserErasedInDrag) {
            pushHistory(p);
            eraserErasedInDrag = true;
          }
          p.elements = nextEls;
          render();
        }
      }

      function drawGrid(targetCtx, w, h) {
        const step = 40;
        targetCtx.save();
        targetCtx.strokeStyle = "#e2e8f0";
        targetCtx.lineWidth = 1;
        targetCtx.beginPath();
        for (let x = step; x < w; x += step) {
          targetCtx.moveTo(x, 0);
          targetCtx.lineTo(x, h);
        }
        for (let y = step; y < h; y += step) {
          targetCtx.moveTo(0, y);
          targetCtx.lineTo(w, y);
        }
        targetCtx.stroke();
        targetCtx.restore();
      }

      function drawDimension(targetCtx, el) {
        const x1 = el.x1, y1 = el.y1, x2 = el.x2, y2 = el.y2;
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const arrowLen = 18;
        const arrowAngle = Math.PI / 7;

        targetCtx.save();
        targetCtx.strokeStyle = el.color || "#111827";
        targetCtx.fillStyle = el.color || "#111827";
        targetCtx.lineWidth = 2.4;

        targetCtx.beginPath();
        targetCtx.moveTo(x1, y1);
        targetCtx.lineTo(x2, y2);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(x1, y1);
        targetCtx.lineTo(x1 + arrowLen * Math.cos(angle - arrowAngle), y1 + arrowLen * Math.sin(angle - arrowAngle));
        targetCtx.lineTo(x1 + arrowLen * Math.cos(angle + arrowAngle), y1 + arrowLen * Math.sin(angle + arrowAngle));
        targetCtx.closePath();
        targetCtx.fill();

        targetCtx.beginPath();
        targetCtx.moveTo(x2, y2);
        targetCtx.lineTo(x2 - arrowLen * Math.cos(angle - arrowAngle), y2 - arrowLen * Math.sin(angle - arrowAngle));
        targetCtx.lineTo(x2 - arrowLen * Math.cos(angle + arrowAngle), y2 - arrowLen * Math.sin(angle + arrowAngle));
        targetCtx.closePath();
        targetCtx.fill();

        const label = (el.text && el.text.trim()) ? el.text.trim() : "寸法";
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;

        targetCtx.font = "bold 24px sans-serif";
        targetCtx.textAlign = "center";
        targetCtx.textBaseline = "middle";
        const metrics = targetCtx.measureText(label);
        const boxW = metrics.width + 20;
        const boxH = 34;

        targetCtx.fillStyle = "#ffffff";
        targetCtx.fillRect(mx - boxW / 2, my - boxH / 2, boxW, boxH);
        targetCtx.strokeStyle = el.color || "#111827";
        targetCtx.lineWidth = 1.2;
        targetCtx.strokeRect(mx - boxW / 2, my - boxH / 2, boxW, boxH);

        targetCtx.fillStyle = el.color || "#111827";
        targetCtx.fillText(label, mx, my + 1);
        targetCtx.restore();
      }

      function drawElement(targetCtx, el) {
        targetCtx.save();
        targetCtx.strokeStyle = el.color || "#111827";
        targetCtx.fillStyle = el.color || "#111827";
        targetCtx.lineWidth = el.width || 2.4;
        targetCtx.lineCap = "round";
        targetCtx.lineJoin = "round";

        if (el.type === "stroke") {
          if (!el.points || el.points.length === 0) {
            targetCtx.restore();
            return;
          }
          if (el.points.length === 1) {
            targetCtx.beginPath();
            targetCtx.arc(el.points[0].x, el.points[0].y, (el.width || 2.4) / 2, 0, Math.PI * 2);
            targetCtx.fill();
          } else {
            targetCtx.beginPath();
            targetCtx.moveTo(el.points[0].x, el.points[0].y);
            for (let i = 1; i < el.points.length; i++) {
              targetCtx.lineTo(el.points[i].x, el.points[i].y);
            }
            targetCtx.stroke();
          }
        } else if (el.type === "line") {
          targetCtx.beginPath();
          targetCtx.moveTo(el.x1, el.y1);
          targetCtx.lineTo(el.x2, el.y2);
          targetCtx.stroke();
        } else if (el.type === "rect") {
          targetCtx.strokeRect(el.x, el.y, el.w, el.h);
        } else if (el.type === "ellipse") {
          targetCtx.beginPath();
          targetCtx.ellipse(el.cx, el.cy, el.rx, el.ry, 0, 0, Math.PI * 2);
          targetCtx.stroke();
        } else if (el.type === "dimension") {
          drawDimension(targetCtx, el);
        }
        targetCtx.restore();
      }

      function renderPageToCanvas(page, targetCanvas, withGrid) {
        const size = getLogicalSize(page);
        targetCanvas.width = size.width;
        targetCanvas.height = size.height;
        const tCtx = targetCanvas.getContext("2d");
        tCtx.fillStyle = "#ffffff";
        tCtx.fillRect(0, 0, size.width, size.height);
        if (withGrid) drawGrid(tCtx, size.width, size.height);
        for (let i = 0; i < page.elements.length; i++) {
          drawElement(tCtx, page.elements[i]);
        }
      }

      function render() {
        renderPageToCanvas(currentPage(), canvas, showGrid);

        if (isDrawing && tool === "pen" && currentPoints.length > 0) {
          drawElement(ctx, {
            type: "stroke",
            points: currentPoints,
            color: penColor,
            width: penWidth
          });
        }

        if (isDrawing && tool === "dim" && dimStart && dimCurrent) {
          drawDimension(ctx, {
            x1: dimStart.x,
            y1: dimStart.y,
            x2: dimCurrent.x,
            y2: dimCurrent.y,
            text: "...",
            color: penColor
          });
        }

        if (tool === "eraser" && eraserPos) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(eraserPos.x, eraserPos.y, 24, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(239, 68, 68, 0.16)";
          ctx.fill();
          ctx.strokeStyle = "#ef4444";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
      }

      // 共通の入力開始・移動・終了ハンドラ（Touch + Pointer 両対応）
      function handleStart(pos, mode) {
        if (inputMode && inputMode !== mode) return;
        inputMode = mode;
        logStatus("描画中 (" + tool + ")");

        if (tool === "eraser") {
          isDrawing = true;
          eraserErasedInDrag = false;
          eraserPos = pos;
          eraseAt(pos);
          render();
          return;
        }

        if (tool === "dim") {
          const hitDim = findDimensionAt(pos);
          if (hitDim) {
            inputMode = null;
            openDimModal(hitDim, false);
            return;
          }
          isDrawing = true;
          dimStart = pos;
          dimCurrent = pos;
          render();
          return;
        }

        isDrawing = true;
        currentPoints = [pos];
        render();
      }

      function handleMove(pos, mode) {
        if (inputMode && inputMode !== mode) return;

        if (tool === "eraser") {
          eraserPos = pos;
          if (isDrawing) eraseAt(pos);
          render();
          return;
        }

        if (!isDrawing) return;

        if (tool === "dim" && dimStart) {
          let x2 = pos.x;
          let y2 = pos.y;
          const deg = Math.abs(Math.atan2(y2 - dimStart.y, x2 - dimStart.x) * 180 / Math.PI);
          if (deg < 5 || deg > 175) y2 = dimStart.y;
          if (Math.abs(deg - 90) < 5) x2 = dimStart.x;
          dimCurrent = { x: x2, y: y2 };
          render();
          return;
        }

        if (tool === "pen") {
          currentPoints.push(pos);
          render();
        }
      }

      function handleEnd(mode) {
        if (inputMode && inputMode !== mode) return;
        inputMode = null;

        if (tool === "eraser") {
          isDrawing = false;
          eraserErasedInDrag = false;
          render();
          logStatus("消去完了");
          return;
        }

        if (!isDrawing) return;
        isDrawing = false;

        if (tool === "dim" && dimStart && dimCurrent) {
          const dist = Math.hypot(dimCurrent.x - dimStart.x, dimCurrent.y - dimStart.y);
          const s = dimStart;
          const c = dimCurrent;
          dimStart = null;
          dimCurrent = null;
          if (dist > 25) {
            openDimModal({
              type: "dimension",
              x1: s.x,
              y1: s.y,
              x2: c.x,
              y2: c.y,
              text: "",
              color: penColor
            }, true);
          } else {
            render();
          }
          return;
        }

        if (tool === "pen" && currentPoints.length > 0) {
          const p = currentPage();
          pushHistory(p);
          const shape = recognizeShape(currentPoints, penColor, penWidth);
          p.elements.push(shape);
          currentPoints = [];
          render();
          logStatus("図形確定: " + shape.type);
        }
      }

      // Touch イベント（iOS Safari 確実対応）
      canvas.addEventListener("touchstart", function (e) {
        if (!e.touches || e.touches.length === 0) return;
        e.preventDefault();
        const t = e.touches[0];
        handleStart(clientToCanvas(t.clientX, t.clientY), "touch");
      }, { passive: false });

      canvas.addEventListener("touchmove", function (e) {
        if (!e.touches || e.touches.length === 0) return;
        e.preventDefault();
        const t = e.touches[0];
        handleMove(clientToCanvas(t.clientX, t.clientY), "touch");
      }, { passive: false });

      canvas.addEventListener("touchend", function (e) {
        e.preventDefault();
        handleEnd("touch");
      }, { passive: false });

      canvas.addEventListener("touchcancel", function (e) {
        e.preventDefault();
        handleEnd("touch");
      }, { passive: false });

      // Pointer イベント（PCマウス・スタイラス対応）
      canvas.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch") return;
        handleStart(clientToCanvas(e.clientX, e.clientY), "pointer");
      });

      canvas.addEventListener("pointermove", function (e) {
        if (e.pointerType === "touch") return;
        handleMove(clientToCanvas(e.clientX, e.clientY), "pointer");
      });

      canvas.addEventListener("pointerup", function (e) {
        if (e.pointerType === "touch") return;
        handleEnd("pointer");
      });

      canvas.addEventListener("pointercancel", function (e) {
        if (e.pointerType === "touch") return;
        handleEnd("pointer");
      });

      // 寸法モーダル
      const dimModal = document.getElementById("dim-modal");
      const dimInput = document.getElementById("dim-input");

      function openDimModal(dimObj, isNew) {
        pendingDimTarget = dimObj;
        isNewDim = isNew;
        dimInput.value = dimObj.text || "";
        dimModal.classList.add("open");
        setTimeout(function () {
          try { dimInput.focus(); } catch (_) {}
        }, 50);
      }

      function closeDimModal() {
        dimModal.classList.remove("open");
        pendingDimTarget = null;
        render();
      }

      document.querySelectorAll(".unit-chip").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const u = btn.getAttribute("data-unit") || "";
          if (u === "φ") {
            dimInput.value = "φ" + dimInput.value;
          } else {
            dimInput.value = dimInput.value + u;
          }
        });
      });

      document.getElementById("dim-ok").addEventListener("click", function () {
        if (!pendingDimTarget) return;
        const p = currentPage();
        pushHistory(p);
        pendingDimTarget.text = (dimInput.value || "").trim() || "寸法";
        if (isNewDim) p.elements.push(pendingDimTarget);
        closeDimModal();
      });

      document.getElementById("dim-cancel").addEventListener("click", closeDimModal);

      // ツール・設定ボタン
      function setTool(nextTool) {
        tool = nextTool;
        eraserPos = null;
        document.getElementById("tool-pen").classList.toggle("active", tool === "pen");
        document.getElementById("tool-dim").classList.toggle("active", tool === "dim");
        document.getElementById("tool-eraser").classList.toggle("active", tool === "eraser");
        statusMsg.textContent =
          tool === "pen" ? "ペンモード：丸・四角・直線を描くと自動で図面化します" :
          tool === "dim" ? "寸法線モード：ドラッグで両矢印を引き、寸法を入力します" :
          "消しゴムモード：消したい線・図形・寸法線をなぞると丸ごと消えます";
        render();
      }

      document.getElementById("tool-pen").addEventListener("click", function () { setTool("pen"); });
      document.getElementById("tool-dim").addEventListener("click", function () { setTool("dim"); });
      document.getElementById("tool-eraser").addEventListener("click", function () { setTool("eraser"); });

      const btnShape = document.getElementById("toggle-shape");
      btnShape.addEventListener("click", function () {
        autoShape = !autoShape;
        btnShape.textContent = autoShape ? "✨ 図形認識: ON" : "✍️ 図形認識: OFF";
        btnShape.classList.toggle("toggle-on", autoShape);
      });

      document.querySelectorAll(".color-dot").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".color-dot").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          penColor = btn.getAttribute("data-color") || "#111827";
        });
      });

      document.querySelectorAll(".width-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".width-btn").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          penWidth = parseFloat(btn.getAttribute("data-width")) || 2.4;
        });
      });

      document.getElementById("btn-undo").addEventListener("click", undo);
      document.getElementById("btn-redo").addEventListener("click", redo);
      document.getElementById("btn-clear").addEventListener("click", function () {
        const p = currentPage();
        if (!p.elements.length) return;
        pushHistory(p);
        p.elements = [];
        render();
      });

      function updateUIState() {
        const p = currentPage();
        document.getElementById("page-label").textContent = (currentPageIndex + 1) + " / " + pages.length + " ページ";
        document.getElementById("page-prev").disabled = currentPageIndex === 0;
        document.getElementById("page-next").disabled = currentPageIndex === pages.length - 1;
        document.getElementById("page-del").disabled = pages.length <= 1;
        document.getElementById("btn-undo").disabled = p.undoStack.length === 0;
        document.getElementById("btn-redo").disabled = p.redoStack.length === 0;
        document.getElementById("toggle-orient").textContent = p.orientation === "portrait" ? "📄 A4縦" : "📄 A4横";
      }

      document.getElementById("page-prev").addEventListener("click", function () {
        if (currentPageIndex > 0) {
          currentPageIndex--;
          resizeCanvasDisplay();
          updateUIState();
        }
      });

      document.getElementById("page-next").addEventListener("click", function () {
        if (currentPageIndex < pages.length - 1) {
          currentPageIndex++;
          resizeCanvasDisplay();
          updateUIState();
        }
      });

      document.getElementById("page-add").addEventListener("click", function () {
        pages.splice(currentPageIndex + 1, 0, createPage(currentPage().orientation, []));
        currentPageIndex++;
        resizeCanvasDisplay();
        updateUIState();
      });

      document.getElementById("page-dup").addEventListener("click", function () {
        const src = currentPage();
        pages.splice(currentPageIndex + 1, 0, createPage(src.orientation, src.elements));
        currentPageIndex++;
        resizeCanvasDisplay();
        updateUIState();
        statusMsg.textContent = "現在の図面を " + (currentPageIndex + 1) + " ページ目に複製しました";
      });

      document.getElementById("page-del").addEventListener("click", function () {
        if (pages.length <= 1) return;
        pages.splice(currentPageIndex, 1);
        if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;
        resizeCanvasDisplay();
        updateUIState();
      });

      document.getElementById("toggle-orient").addEventListener("click", function () {
        const p = currentPage();
        p.orientation = p.orientation === "portrait" ? "landscape" : "portrait";
        resizeCanvasDisplay();
        updateUIState();
      });

      const btnGrid = document.getElementById("toggle-grid");
      btnGrid.addEventListener("click", function () {
        showGrid = !showGrid;
        btnGrid.textContent = showGrid ? "＃ 方眼: ON" : "＃ 方眼: OFF";
        btnGrid.classList.toggle("toggle-on", showGrid);
        render();
      });

      const btnGridExp = document.getElementById("toggle-grid-export");
      btnGridExp.addEventListener("click", function () {
        includeGridOnExport = !includeGridOnExport;
        btnGridExp.textContent = includeGridOnExport ? "出力方眼: ON" : "出力方眼: OFF";
        btnGridExp.classList.toggle("toggle-on", includeGridOnExport);
      });

      document.getElementById("export-png").addEventListener("click", function () {
        const off = document.createElement("canvas");
        renderPageToCanvas(currentPage(), off, includeGridOnExport);
        const a = document.createElement("a");
        a.download = "図面_P" + (currentPageIndex + 1) + ".png";
        a.href = off.toDataURL("image/png");
        a.click();
      });

      document.getElementById("export-pdf").addEventListener("click", function () {
        const container = document.getElementById("print-container");
        container.innerHTML = "";
        pages.forEach(function (p) {
          const off = document.createElement("canvas");
          renderPageToCanvas(p, off, includeGridOnExport);
          const div = document.createElement("div");
          div.className = "print-page";
          const img = document.createElement("img");
          img.src = off.toDataURL("image/png");
          div.appendChild(img);
          container.appendChild(div);
        });
        setTimeout(function () { window.print(); }, 150);
      });

      window.addEventListener("resize", resizeCanvasDisplay);
      resizeCanvasDisplay();
      updateUIState();
      logStatus("準備完了（タッチ対応）");
    })();
  </script>
</body>
</html>
